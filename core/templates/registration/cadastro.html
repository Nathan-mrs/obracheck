{% extends "core/base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block conteudo %}
<div class="card auth" style="max-width:560px">
  <h1>Criar conta</h1>
  <p class="muted">Escolha o seu perfil: a construtora gerencia as obras; o dono da obra acompanha e aprova.</p>
  <form method="post">{% csrf_token %}
    {% include "core/_campos.html" %}
    <button class="btn" type="submit" style="width:100%;justify-content:center">Criar conta</button>
  </form>
  <p class="muted" style="margin-top:1rem">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
</div>
{% endblock %}
