{% extends "core/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card auth">
  <h1>Entrar no ObraCheck</h1>
  <p class="muted">Acesse como construtora ou como dono da obra.</p>
  <form method="post">{% csrf_token %}
    {% include "core/_campos.html" %}
    <button class="btn" type="submit" style="width:100%;justify-content:center">Entrar</button>
  </form>
  <p class="muted" style="margin-top:1rem">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>
{% endblock %}
