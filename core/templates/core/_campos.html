{% for campo in form %}
<div class="campo">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<div class="ajuda">{{ campo.help_text|safe }}</div>{% endif %}
  {% for e in campo.errors %}<div class="erro">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
{% for e in form.non_field_errors %}<div class="msg msg-error">{{ e }}</div>{% endfor %}
